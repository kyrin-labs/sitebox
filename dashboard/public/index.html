<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiteBox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header__inner">
        <div class="header__brand">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15.9 12 20.5 12 23.1 4 18.5Z"/><path d="M20 15.9 12 20.5 12 23.1 20 18.5Z"/><path d="M12 11.3 20 15.9 12 20.5 4 15.9Z"/><path d="M4 10.7 12 15.3 12 17.9 4 13.3Z"/><path d="M20 10.7 12 15.3 12 17.9 20 13.3Z"/><path d="M12 6.1 20 10.7 12 15.3 4 10.7Z"/><path d="M4 5.5 12 10.1 12 12.7 4 8.1Z" fill="var(--accent)"/><path d="M20 5.5 12 10.1 12 12.7 20 8.1Z" fill="var(--accent)"/><path d="M12 0.9 20 5.5 12 10.1 4 5.5Z" fill="var(--accent)"/></g><path d="M12 3.11 16.16 5.5 12 7.89 7.84 5.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10.13" cy="5.5" r="1.1" fill="currentColor"/></svg>
          <h1>SiteBox</h1>
        </div>
        <div class="header__actions">
          <button id="btn-theme" class="btn btn--ghost" title="Toggle theme">
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
          <button id="btn-refresh" class="btn btn--ghost" title="Refresh">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
          </button>
          <button id="btn-add" class="btn btn--primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            Add Site
          </button>
        </div>
      </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar__inner">
        <div class="search-box">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="search" placeholder="Search sites..." autocomplete="off">
        </div>
        <div class="filter-group" id="filters">
          <button class="filter active" data-cat="all">All</button>
        </div>
        <div class="toolbar__stats">
          <span id="stat-total">0</span> sites · <span id="stat-running">0</span> running
        </div>
      </div>
    </div>

    <!-- Sites Grid -->
    <main class="main">
      <div class="sites-grid" id="sites-grid"></div>
      <div class="empty-state" id="empty-state" style="display:none">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--border)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
        <p>No sites yet. Click "Add Site" to get started.</p>
      </div>
    </main>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="modal" style="display:none">
      <div class="modal">
        <div class="modal__header">
          <h2 id="modal-title">Add Site</h2>
          <button id="modal-close" class="btn btn--ghost">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <form id="site-form" class="modal__body">
          <input type="hidden" id="form-id">
          <div class="field">
            <label for="form-name">Name</label>
            <input type="text" id="form-name" required placeholder="My Site">
          </div>
          <div class="field">
            <label for="form-desc">Description</label>
            <input type="text" id="form-desc" placeholder="Short description">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="form-port">Port</label>
              <input type="number" id="form-port" min="1024" max="65535" required placeholder="4451">
            </div>
            <div class="field">
              <label for="form-icon">Icon</label>
              <input type="text" id="form-icon" placeholder="globe">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="form-category">Category</label>
              <input type="text" id="form-category" placeholder="tools">
            </div>
            <div class="field">
              <label for="form-icon-color">Icon Color</label>
              <div class="color-input">
                <input type="color" id="form-icon-color" value="#58a6ff">
                <input type="text" id="form-icon-color-text" placeholder="#58a6ff" value="#58a6ff">
              </div>
            </div>
          </div>
          <div class="field">
            <label for="form-path">Site path (relative to sitebox root)</label>
            <input type="text" id="form-path" placeholder="sites/my-site">
          </div>
          <div class="field" id="port-check-result" style="display:none"></div>
          <div class="modal__actions">
            <button type="button" id="form-cancel" class="btn btn--outline">Cancel</button>
            <button type="submit" class="btn btn--primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Logs Modal -->
    <div class="modal-overlay" id="logs-modal" style="display:none">
      <div class="modal modal--wide">
        <div class="modal__header">
          <h2 id="logs-title">Logs</h2>
          <div class="modal__header-actions">
            <button id="logs-refresh" class="btn btn--outline btn--sm">Refresh</button>
            <button id="logs-clear" class="btn btn--outline btn--sm">Clear</button>
            <button id="logs-close" class="btn btn--ghost" title="Close">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
        </div>
        <pre class="logs-view" id="logs-view">No logs yet — start the site to capture its output.</pre>
      </div>
    </div>

  </div>
  <script src="/js/main.js"></script>
</body>
</html>
