<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SiteBox">
  <title>SiteBox</title>
  <!-- Derived from logo.svg: transparent background, window detail dropped and stroke
       thickened so the stack reads at 16 px. Colours follow the browser chrome scheme
       so the mark stays visible on both light and dark tabs. -->
  <style>
    :root { color: #1a1a2e; }
    .lit { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      :root { color: #e6edf3; }
      .lit { fill: #58a6ff; }
    }
  </style>
  <g transform="translate(0.4 0.4) scale(1.3)" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 15.9 12 20.5 12 23.1 4 18.5Z"/>
    <path d="M20 15.9 12 20.5 12 23.1 20 18.5Z"/>
    <path d="M12 11.3 20 15.9 12 20.5 4 15.9Z"/>
    <path d="M4 10.7 12 15.3 12 17.9 4 13.3Z"/>
    <path d="M20 10.7 12 15.3 12 17.9 20 13.3Z"/>
    <path d="M12 6.1 20 10.7 12 15.3 4 10.7Z"/>
    <path class="lit" d="M4 5.5 12 10.1 12 12.7 4 8.1Z"/>
    <path class="lit" d="M20 5.5 12 10.1 12 12.7 20 8.1Z"/>
    <path class="lit" d="M12 0.9 20 5.5 12 10.1 4 5.5Z"/>
  </g>
</svg>
