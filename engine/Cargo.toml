[package]
name = "sitebox-rs"
version = "0.1.2"
edition = "2021"
description = "SiteBox engine — manifests, checks, static serve, supervisor, dashboard API, MCP"
license = "MIT"

[lib]
name = "sitebox_rs"
path = "src/lib.rs"

[[bin]]
name = "sitebox"
path = "src/bin/sitebox.rs"

[[bin]]
name = "siteboxd"
path = "src/bin/siteboxd.rs"

[[bin]]
name = "sitebox-mcp"
path = "src/bin/sitebox_mcp.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures-core = "0.3"
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
libc = "0.2"
mime_guess = "2"
percent-encoding = "2"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
walkdir = "2"
webp = "0.3"

[profile.release]
opt-level = 2
lto = "thin"
