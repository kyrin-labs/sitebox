services:
  sitebox:
    build: .
    container_name: sitebox
    # Host networking so site ports (4500-4899) are reachable on the host exactly
    # as the dashboard advertises them.
    network_mode: host
    # Reap the site processes the supervisor spawns (serve = "node" sites).
    init: true
    # Run as the host's own uid/gid. Two reasons, both operational:
    #   * every file the dashboard or a site writes lands as the host user, so the
    #     host-side token CLI (the lock-out recovery path) can always write
    #     dashboard/data/tokens.json — as root it would flip to root:600 on the
    #     first atomic rename and the CLI would get EACCES;
    #   * no more root-owned uploads/data files mixed into sites/.
    # Anything already created as root needs a one-time chown sweep with the
    # container stopped (see scripts/sitebox-deploy.sh).
    user: "1000:1000"

    environment:
      # Web search for Sols. Compose reads these from .env next to this file.
      # Host networking means a local SearXNG is reachable at 127.0.0.1.
      - SEARXNG_URL=${SEARXNG_URL:-http://127.0.0.1:8899}
      - SOLS_FETCH_ALLOW=${SOLS_FETCH_ALLOW:-}
      - SEARXNG_ENGINES=${SEARXNG_ENGINES:-}
      # AI gateway for Sols. These override settings.json from the data volume.
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_KEY=${AI_API_KEY:-}
    volumes:
      # Runtime config, site folders and logs are mounted from the host, so the
      # image stays code-only and `docker compose up -d --build` picks up edits.
      - ./dashboard/data:/app/dashboard/data
      - ./sites:/app/sites
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4445/api/sites"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
