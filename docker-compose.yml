services:
  sitebox:
    build: .
    container_name: sitebox
    # Host networking so site ports (4500-4899) are reachable on the host exactly
    # as the dashboard advertises them.
    network_mode: host
    # Reap the site processes the supervisor spawns (serve = "node" sites).
    init: true
    volumes:
      # Runtime config, site folders and logs are mounted from the host, so the
      # image stays code-only and `docker compose up -d --build` picks up edits.
      - ./dashboard/data:/app/dashboard/data
      - ./sites:/app/sites
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4445/api/sites"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
